[package]
name = "portableforge-core"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PortableForge core: snapshot/diff engine, classification, PortableApps.com Format generation and validation, Windows Sandbox configuration."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
image = { version = "=0.25.10", default-features = false, features = ["ico", "png"] }
