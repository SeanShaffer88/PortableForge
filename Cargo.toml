[workspace]
resolver = "2"
members = [
    "crates/portableforge-core",
    "apps/portableforge",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
authors = ["Sean Shaffer"]
license = "MIT"
repository = "https://github.com/SeanShaffer88/PortableForge"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
