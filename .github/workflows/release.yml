name: Release

# Tag a commit `vX.Y.Z` (only once the release-readiness checklist
# in docs/RELEASE_READINESS.md passes) and this builds the release's
# two assets — the installer loose, and one zip with the portable
# build — and attaches both to a GitHub Release of the same name.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Gate (the full suite, same as CI)
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Release build
        run: cargo build --locked --release

      - name: Stage the bundled Sandboxie installer (pinned, fingerprint-checked)
        shell: pwsh
        run: |
          # The pin lives in crates/portableforge-core/src/tools.rs;
          # these values must match it. The file is the maker's own
          # unmodified installer, redistributed free of charge under
          # its license (third-party/ ships the texts + notice).
          $url = "https://github.com/sandboxie-plus/Sandboxie/releases/download/v1.18.8/Sandboxie-Plus-x64-v1.18.8.exe"
          $want = "f27078ff74a07906fd51476079e1a7a8f5e20c8bb75a9d2ae86169d47179ae76"
          New-Item -ItemType Directory -Path bundled | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "bundled/Sandboxie-Plus-x64-v1.18.8.exe"
          $got = (Get-FileHash "bundled/Sandboxie-Plus-x64-v1.18.8.exe" -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "Bundled Sandboxie installer fingerprint mismatch: $got" }
          Write-Host "Bundled Sandboxie installer verified: $got"

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup (ISCC.exe) not found on the runner" }
          & $iscc "/DAppVersion=$ver" installer/PortableForge.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Assemble the two release assets
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          # Asset 1: the installer, loose (never inside a zip).
          $installer = "PortableForge-Setup-v$ver-x64.exe"
          Copy-Item "installer/Output/$installer" $installer
          # Asset 2: the portable zip — the two programs (the helper
          # must stay beside the main program), LICENSE, PORTABLE note.
          $portDir = "portable"
          New-Item -ItemType Directory -Path $portDir | Out-Null
          Copy-Item target/release/portableforge.exe $portDir
          Copy-Item target/release/portableforge-agent.exe $portDir
          Copy-Item LICENSE $portDir
          Copy-Item installer/PORTABLE.txt $portDir
          # The bundled Sandboxie installer + its licenses and
          # notice, in their own folder (see third-party/).
          New-Item -ItemType Directory -Path "$portDir/bundled" | Out-Null
          Copy-Item bundled/Sandboxie-Plus-x64-v1.18.8.exe "$portDir/bundled"
          Copy-Item third-party/SANDBOXIE-NOTICE.txt "$portDir/bundled"
          Copy-Item third-party/Sandboxie-LICENSE-Plus.txt "$portDir/bundled"
          Copy-Item third-party/Sandboxie-LICENSE-Classic.txt "$portDir/bundled"
          $portZip = "PortableForge-v$ver-portable.zip"
          Compress-Archive -Path "$portDir/*" -DestinationPath $portZip
          "INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PORTZIP=$portZip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $instHash = (Get-FileHash $env:INSTALLER -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash $env:PORTZIP -Algorithm SHA256).Hash.ToLower()
          $notes = @"
          PortableForge $tag — the guided portable-package maker.

          **This build is unsigned.** Windows SmartScreen will warn on
          first run; choose "More info" then "Run anyway" only if the
          fingerprint of your download matches the list below.

          Two downloads:
          - **Installer** ($env:INSTALLER): a normal per-user install
            (no admin needed) with a Start menu shortcut. It installs
            both programs together — the helper belongs beside the
            main program.
          - **Portable** ($env:PORTZIP): unzip anywhere and run
            portableforge.exe from the folder. Keep
            portableforge-agent.exe beside it.

          Both downloads also carry the official Sandboxie-Plus
          installer (unmodified, about 24 MB) in a `bundled` folder,
          with its licenses and a note — PortableForge offers to open
          it only when a computer has no test box yet (for example
          Windows Home), so the quick test box can be set up.

          SHA-256 fingerprints:
          - $env:INSTALLER — $instHash
          - $env:PORTZIP — $zipHash
          "@
          # The release may already exist (created from the web UI to
          # make the tag); create it if not, then attach both assets.
          gh release create $tag --title "PortableForge $tag" --notes $notes
          if ($LASTEXITCODE -ne 0) { Write-Host "Release already exists; attaching the assets to it." }
          gh release upload $tag "$env:INSTALLER" "$env:PORTZIP" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Attaching the release assets failed" }
          # Always land the fingerprint notes, even when the release
          # itself was created from the web UI (to make the tag).
          gh release edit $tag --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Refreshing the release notes failed" }
